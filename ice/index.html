<script>
var snowSVG="<svg xmlns='http://w3.org' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='#111113'/><circle cx='256' cy='256' r='222' fill='none' stroke='#d4af37' stroke-width='10' opacity='0.85'/><g stroke='#f3d98b' stroke-width='16' stroke-linecap='round' fill='none'><line x1='256' y1='96' x2='256' y2='416'/><line x1='117' y1='176' x2='395' y2='336'/><line x1='395' y1='176' x2='117' y2='336'/><polyline points='220,136 256,172 292,136'/><polyline points='220,376 256,340 292,376'/><polyline points='136,222 184,214 176,166'/><polyline points='376,290 328,298 336,346'/><polyline points='336,166 328,214 376,222'/><polyline points='176,346 184,298 136,290'/></g><circle cx='256' cy='256' r='26' fill='#111113' stroke='#d4af37' stroke-width='12'/><circle cx='256' cy='256' r='8' fill='#fff'/></svg>";
var goldBarSVG="<svg xmlns='http://w3.org' viewBox='0 0 64 64' width='40' height='40'><defs><linearGradient id='g1' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#fff1b8'/><stop offset='50%' stop-color='#d4af37'/><stop offset='100%' stop-color='#8c6b15'/></linearGradient></defs><polygon points='18,18 46,18 56,44 8,44' fill='url(#g1)' stroke='#f3d98b' stroke-width='1.5' stroke-linejoin='round'/><polygon points='21,22 43,22 49,38 15,38' fill='#fceabb' opacity='0.5'/><polygon points='8,44 56,44 53,49 11,49' fill='#7a5c10'/></svg>";
document.getElementById('hb').innerHTML=snowSVG;
var U2G={g:1,qian:3.75,liang:37.5,oz:31.1034768},UL={g:'g',qian:'台錢',liang:'台兩',oz:'oz'},rec=[];
try{rec=JSON.parse(localStorage.getItem('ice_gold_records')||'[]')}catch(e){}
var photo='',cp=document.getElementById('cp'),modeEl=document.getElementById('priceMode'),gramEl=document.getElementById('gramPriceHint');
if(localStorage.getItem('ice_gold_price_qian')){cp.value=localStorage.getItem('ice_gold_price_qian');if(localStorage.getItem('ice_gold_is_manual')==='1')modeEl.textContent='✍️ 目前為手動自訂牌價';}
cp.oninput=function(){localStorage.setItem('ice_gold_price_qian',cp.value);localStorage.setItem('ice_gold_is_manual','1');modeEl.textContent='✍️ 手動自訂牌價 (按右側可重抓即時)';render()};
function applyPrice(twdQian){
  cp.value=twdQian;localStorage.setItem('ice_gold_price_qian',twdQian);localStorage.setItem('ice_gold_is_manual','0');
  var n=new Date();modeEl.textContent='🟢 已同步國際即期 ('+('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+')';render();
}
function fetchLiveGold(force){
  if(!force && localStorage.getItem('ice_gold_is_manual')==='1' && cp.value){render();return}
  modeEl.textContent='⏳ 更新即時金價中...';
  fetch('/.netlify/functions/gold?t='+Date.now()).then(function(r){return r.json()}).then(function(d){
    if(d && d.qian>0){applyPrice(d.qian)}else{throw new Error()}
  }).catch(function(){modeEl.textContent='⚠️ 報價暫時無法連線，請直接手動輸入';render()});
}
document.getElementById('bSync').onclick=function(){fetchLiveGold(true)};
function updateHint(){var w=parseFloat(document.getElementById('fW').value)||0,u=document.getElementById('fU').value,c=parseFloat(document.getElementById('fC').value)||0,q=(w*(U2G[u]||1))/3.75,perQ=q>0&&c>0?Math.round(c/q):0;document.getElementById('unitHint').textContent='換算單價：$'+(perQ>0?perQ.toLocaleString():'0')+' / 台錢'}
document.getElementById('fW').oninput=updateHint;document.getElementById('fU').onchange=updateHint;document.getElementById('fC').oninput=updateHint;
var md=document.getElementById('md');
document.getElementById('bOpen').onclick=function(){var t=new Date();document.getElementById('fD').value=t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2);document.getElementById('fW').value='';document.getElementById('fC').value='';document.getElementById('fN').value='';document.getElementById('fP').value='';document.getElementById('pp').style.display='none';photo='';updateHint();md.classList.add('active')};
document.getElementById('bClose').onclick=function(){md.classList.remove('active')};
document.getElementById('fP').onchange=function(e){var f=e.target.files&&e.target.files;if(!f)return;var r=new FileReader();r.onload=function(ev){var g=new Image();g.onload=function(){var c=document.createElement('canvas'),m=800,w=g.width,h=g.height;if(w>h&&w>m){h=h*m/w;w=m}else if(h>m){w=w*m/h;h=m}c.width=w;c.height=h;c.getContext('2d').drawImage(g,0,0,w,h);photo=c.toDataURL('image/jpeg',.72);var p=document.getElementById('pp');p.src=photo;p.style.display='block'};g.src=ev.target.result};r.readAsDataURL(f)};
document.getElementById('bSave').onclick=function(){var w=parseFloat(document.getElementById('fW').value);if(!w||w<=0){alert('請輸入正確的重量喔！');return}rec.unshift({id:Date.now(),date:document.getElementById('fD').value,weight:w,unit:document.getElementById('fU').value,cost:parseFloat(document.getElementById('fC').value)||0,note:document.getElementById('fN').value.trim(),photo:photo});try{localStorage.setItem('ice_gold_records',JSON.stringify(rec));md.classList.remove('active');render()}catch(e){alert('儲存空間已滿，請先按備份');rec.shift()}};
document.getElementById('iv').onclick=function(){this.classList.remove('active')};
document.getElementById('bEx').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({priceQian:cp.value,records:rec})],{type:'application/json'}));a.download='Ice的小金庫備份.json';a.click()};
document.getElementById('bIm').onclick=function(){document.getElementById('imF').click()};
document.getElementById('imF').onchange=function(e){var f=e.target.files&&e.target.files;if(!f)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(Array.isArray(d.records)){rec=d.records;localStorage.setItem('ice_gold_records',JSON.stringify(rec));if(d.priceQian){cp.value=d.priceQian;localStorage.setItem('ice_gold_price_qian',d.priceQian)}render();alert('還原成功！')}}catch(x){alert('檔案格式不對')}};r.readAsText(f)};
function render(){
  var pq=parseFloat(cp.value)||0,sg=0,sc=0,lc=document.getElementById('lc');lc.innerHTML='';
  gramEl.textContent=pq>0?'(約 $'+Math.round(pq/3.75).toLocaleString()+'/g)':'';
  if(!rec.length){lc.innerHTML='<div class="et">小金庫目前空空的 ❄️<br>點擊下方「＋ 存入新金塊」開始記錄吧！</div>'}
  else{rec.forEach(function(r){
    var g=r.weight*(U2G[r.unit]||1),q=g/3.75;sg+=g;sc+=r.cost;
    var costPerQ=q>0&&r.cost>0?Math.round(r.cost/q):0,mv=pq>0?Math.round(q*pq):null,df=mv!==null?mv-r.cost:null;
    var c=document.createElement('div');c.className='ic';
    if(r.photo){var i=document.createElement('img');i.className='it';i.src=r.photo;i.onclick=function(){document.getElementById('vi').src=r.photo;document.getElementById('iv').classList.add('active')};c.appendChild(i)}
    else{var h=document.createElement('div');h.className='it';h.innerHTML=goldBarSVG;c.appendChild(h)}
    var n=document.createElement('div');n.className='ii';
    var ph='買入總價：$'+r.cost.toLocaleString()+(costPerQ>0?' <span style="color:#d4af37;font-size:12px">($'+costPerQ.toLocaleString()+'/錢)</span>':'');
    if(mv!==null)ph+='<br>目前市值：<span style="color:#f3d98b;font-weight:600">$'+mv.toLocaleString()+'</span> <span style="color:'+(df>=0?'#4cd964':'#ff5e5e')+';font-size:12px">('+(df>=0?'+':'')+'$'+df.toLocaleString()+')</span>';
    n.innerHTML='<div class="itp"><span class="iw">'+r.weight+' '+(UL[r.unit]||'')+' <small style="color:#9a9a9e;font-weight:400">('+g.toFixed(2)+'g)</small></span><span class="id">'+(r.date||'')+'</span></div><div class="ip">'+ph+'</div>';
    if(r.note){var nd=document.createElement('div');nd.className='in';nd.textContent=r.note;n.appendChild(nd)}
    c.appendChild(n);
    var d=document.createElement('button');d.className='db';d.textContent='✕';d.onclick=function(){if(confirm('確定刪除這筆紀錄？')){rec=rec.filter(function(x){return x.id!==r.id});localStorage.setItem('ice_gold_records',JSON.stringify(rec));render()}};
    c.appendChild(d);lc.appendChild(c);
  })}
  var sq=sg/3.75,tm=pq>0?Math.round(sq*pq):0,pf=tm-sc,avgQ=sq>0&&sc>0?Math.round(sc/sq):0;
  document.getElementById('tq').textContent=sq.toFixed(2)+' 台錢';
  document.getElementById('tg').textContent='約 '+sg.toFixed(2)+' 公克 (g)';
  document.getElementById('tc').textContent='$'+Math.round(sc).toLocaleString();
  document.getElementById('avgQian').textContent='平均成本 $'+(avgQ>0?avgQ.toLocaleString():'0')+' / 台錢';
  document.getElementById('rc').textContent=rec.length+' 筆';
  var pe=document.getElementById('tp');
  if(pq>0){document.getElementById('tm').textContent='$'+tm.toLocaleString();pe.textContent='損益 '+(pf>=0?'+':'')+'$'+pf.toLocaleString();pe.style.color=pf>=0?'#4cd964':'#ff5e5e'}
  else{document.getElementById('tm').textContent='請輸入今日牌價';pe.textContent='輸入每錢牌價算損益';pe.style.color='#9a9a9e'}
}
render();
fetchLiveGold(false);
</script>
</body>
</html>
